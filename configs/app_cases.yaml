# Preregistered application cases for the real-application study (docs/9_fresh_start).
# Written before the scored runs of each application; the audit reads it. A case is classifier
# ground truth only when classifier_supported is true and its counters meet a registered rule.
version: 1

protocol:
  storage_tier: /work/hdd
  repeats: 11                       # traced runs per case; 11 on /work/hdd (MEASUREMENT_ALIGNMENT.md)
  controls_per_case: 1              # one uninstrumented run per case (no Darshan preload)
  ordering: round_robin_by_repeat   # repeat k: problem then fix, so drift hits both arms
  confidence: 0.90
  decision_rule: order_statistic_median_interval   # src/llm/closed_loop_metrics.evaluate_candidate
  decision_source: docs/8_real_applications/MEASUREMENT_ALIGNMENT.md
  null_check: results/apps/null_check/nek5000_N1_2026-09-21.json   # 11 + 11 same-case runs: no_significant_change
  # WRF base input (both cases): nocolons = .true. (doc/README.netcdf4par: colons must be removed
  # for pnetcdf), use_netcdf_classic = .true. (Registry/registry.io_boilerplate; otherwise io_netcdf
  # writes NetCDF-4 with deflate level 2, wrf_io.F90 lines 2502-2504, a compression confound), the
  # generated Thompson table qr_acr_qg_V4.dat present so no case computes and writes it.

applications:
  nek5000:
    script: scripts/apps/nek5000/run_turbchannel.slurm
    case_dir: /work/hdd/bdau/mbanisharifdehkordi/apps/nek5000/runs/turbChannel_baseline
    resources: {nodes: 1, ntasks: 32, cpus_per_task: 1, time_limit: "00:15:00", partition: cpu}   # as the null check
    # work that must be identical between a problem run and its fix run (manifest `work`)
    work_invariant: {steps: 200, checkpoint_interval: 50, expected_checkpoints: 5, precision: double, ranks: 32, nodes: 1}
    equivalence:
      source: >-
        Same binary, mesh, partition, input and rank count; only the output organization
        differs, which does not enter the computation. Evidence used to set the rule: the 22
        runs of the null check (results/apps/null_check) printed identical t, DT, Courant
        number and Volflow X at step 200; the development pair of 2026-09-24 (jobs 22349085
        N1 and 22349086 N2, files kept under .codex-trash/nek_dev_2026-09-24) has bitwise
        identical mesh and step-0 fields, while velocity and pressure from step 50 on differ
        at the 1e-12 relative level (sums agree to 15 digits, per-element minima and maxima
        to 12), so hash equality is not the criterion and tolerances are. Field files are
        reassembled into global element order (scripts/apps/nek5000/fld.py, format from
        Nek5000 core/prepost.f) and every variable component is compared through its sum,
        minimum and maximum per checkpoint; the per-element minimum/maximum metadata is
        stored as real*4 by Nek5000, hence its looser tolerance. Log quantities are printed
        with 7 significant digits, hence 1e-6.
      exact_fields: [final_step, run_successful, volflow_step]
      fields:
        final_time: {absolute: 0.0, relative: 1.0e-6}
        final_dt: {absolute: 0.0, relative: 1.0e-6}
        final_courant: {absolute: 0.0, relative: 1.0e-6}
        volflow.0: {absolute: 0.0, relative: 1.0e-6}    # time
        volflow.1: {absolute: 1.0e-6, relative: 1.0e-4} # printed with 5 digits, near zero
        volflow.2: {absolute: 1.0e-6, relative: 1.0e-4}
        volflow.3: {absolute: 0.0, relative: 1.0e-6}    # measured flow rate
        volflow.4: {absolute: 0.0, relative: 1.0e-6}    # target flow rate
      checkpoints:
        - steps: [0, 50, 100, 150, 200]
          exact: [istep, nelog, varcode, nxyz, wdsize]
          components: [X0, X1, X2, U0, U1, U2, P0]
          stats:
            sum: {absolute: 1.0e-6, relative: 1.0e-8}
            min: {absolute: 1.0e-9, relative: 1.0e-8}
            max: {absolute: 1.0e-9, relative: 1.0e-8}
        - steps: [0, 50, 100, 150, 200]
          components: [X_minmax0, U_minmax0, P_minmax0]
          stats:
            sum: {absolute: 1.0e-3, relative: 1.0e-6}
            min: {absolute: 1.0e-6, relative: 1.0e-6}
            max: {absolute: 1.0e-6, relative: 1.0e-6}
    case_order: [N2, N1]              # problem first within every repeat
    cases:
      N1:
        role: fix
        kind: constructed
        args: ["200", "50", "1", "yes"]   # numSteps writeInterval writeNFiles writeDoublePrecision
        knobs: {writeNFiles: 1}
        classifier_supported: false
        expected_labels: []
        allowed_extra_labels: []
        source: >-
          Nek5000 documentation, case files, [GENERAL] writeNFiles: "By default a parallel
          shared file is used" (https://nek5000.github.io/NekDoc/problem_setup/case_files.html).
          The local core/prepost.f mfo_open_files implementation opens one MPI-IO file when
          writeNFiles = 1. This case is the intervention fix, not a full negative control for
          all registered labels.
        io_structure: {files_per_checkpoint: 1, write_module: MPI-IO, shared_file: true}
      N2:
        role: problem
        kind: constructed
        fix_case: N1
        args: ["200", "50", "32", "yes"]
        knobs: {writeNFiles: 32}
        classifier_supported: false
        expected_labels: []
        allowed_extra_labels: []
        source: >-
          Same documentation: writeNFiles = N writes N files, one per I/O rank; with N = 32
          on 32 ranks every rank writes its own file through byte_write (STDIO). The measured
          layout has 32 files per checkpoint, below the registered file_strategy boundary of
          more than 1,000 data files, so it is not classifier ground truth.
        io_structure: {files_per_checkpoint: 32, write_module: STDIO, shared_file: false}
  wrf:
    script: scripts/apps/wrf/run_conus12km.slurm
    base_input: /work/hdd/bdau/mbanisharifdehkordi/apps/wrf/runs/conus12km_task02
    resources: {nodes: 2, ntasks: 128, ntasks_per_node: 64, cpus_per_task: 1, time_limit: "00:30:00", partition: cpu}
    secondary_metric: app_metric     # history_write_s: sum of WRF "Timing for Writing wrfout" seconds
    # work that must be identical between the problem run and its fix run (manifest `work`);
    # the restart, boundary and normalized-namelist checksums are compared across rows by the audit
    work_invariant: {forecast_start: "2019-11-26_23:00:00", forecast_end: "2019-11-27_00:00:00", simulated_seconds: 3600,
                     time_step_s: 72, expected_time_steps: 50, history_interval_m: 60, expected_history_frames: 1,
                     frames_per_outfile: 1, grid_we: 425, grid_sn: 300, grid_vert: 50, ranks: 128, nodes: 2,
                     physics_suite: conus, io_form_restart: 2, io_form_boundary: 2}
    equivalence:
      source: >-
        Same binary (WRF v4.8.0 with the local subgrid_x initialization patch), restart, boundary
        file, tables, namelist except io_form_history, rank count and node count; the history
        output path does not enter the integration. Evidence used to set the rule: development
        pair 22350653 (W1) and 22350654 (W2) of 2026-09-24 (files kept under
        .codex-trash/wrf_dev_2026-09-24): identical dimensions, all 204 history variables
        bitwise identical (per-variable SHA-256 of the raw values read with netCDF4 with masking
        and scaling off), all 136 global attributes identical, and WRF's own diffwrf_nc
        (external/io_netcdf/diffwrf.F90) lists no differing field. The rule therefore requires
        exact equality of every variable, of the dimensions and of the global attributes of the
        history file; no metadata field is excluded. The log fields are exact by construction.
      exact_fields: [success_complete, final_time, completed_steps, history_frames, history_files]
      exact_subtrees:
        - history.wrfout_d01_2019-11-27_00_00_00.dimensions
        - history.wrfout_d01_2019-11-27_00_00_00.variables
        - history.wrfout_d01_2019-11-27_00_00_00.global_attributes
    case_order: [W1, W2]              # problem first within every repeat
    cases:
      W1:
        role: problem
        kind: natural
        fix_case: W2
        args: ["2"]                    # io_form_history
        knobs: {io_form_history: 2}
        classifier_supported: false
        expected_labels: []
        allowed_extra_labels: []
        source: >-
          WRF Users' Guide, namelist variables, &time_control: "io_form_history: I/O format of
          history output file(s); =2 : netCDF ... =11 : parallel netCDF"
          (https://www2.mmm.ucar.edu/wrf/users/wrf_users_guide/build/html/namelist_variables.html);
          local external/io_netcdf/wrf_io.F90: with use_netcdf_classic the file is created with
          NF_64BIT_OFFSET and written by the rank that holds the gathered fields (one POSIX writer,
          job 22350653). Phase 0 (results/apps/wrf/phase0/label_feasibility_2026-09-24.json): the
          whole-job counters satisfy access_granularity, parallelism_efficiency and
          request_alignment for reasons outside the history path (lookup tables and per-rank rsl
          logs), so the case is an intervention baseline, not classifier ground truth.
        io_structure: {write_module: POSIX, shared_file: false, writing_ranks: 1, collective: false,
                       data_model: NETCDF3_64BIT_OFFSET, io_form_history: 2, history_files: 1}
      W2:
        role: fix
        kind: natural
        args: ["11"]
        knobs: {io_form_history: 11}
        classifier_supported: false
        expected_labels: []
        allowed_extra_labels: []
        source: >-
          Same Users' Guide entry (=11 parallel netCDF); NERSC WRF benchmark page
          (https://docs.nersc.gov/applications/wrf/wrf_benchmark/): the parallel netCDF option
          "shortens the time spent on writing the output file from 20-40 seconds to 3-5 seconds";
          local external/io_pnetcdf/wrf_io.F90 line 1260: NFMPI_CREATE with NF_64BIT_OFFSET, so
          all ranks write one shared file through collective MPI-IO (26,112 collective writes in
          job 22350654). doc/README.netcdf4par: colons must be removed from the file name for
          pnetcdf, hence nocolons in both cases. Not registered as healthy: the same three
          whole-job rules hold for it (Phase 0), so it is the measured fix, not a negative control.
        io_structure: {write_module: MPI-IO, shared_file: true, collective: true,
                       data_model: NETCDF3_64BIT_OFFSET, io_form_history: 11, history_files: 1}
