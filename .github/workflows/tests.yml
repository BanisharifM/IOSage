name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: PYTHONNOUSERSITE=1 python -m pytest
